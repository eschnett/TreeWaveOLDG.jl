# What one node does with the thirteen-patch ball: `bin/ball_benchmark.jl`
# at 1, 8, 16, 32 and 64 threads, `P = 3`, `E = 4`, on its benchmark
# ball: the cube `[−4, 4]³`, `Rm = 12`, `R1 = 100`, 16 elements across
# each patch angularly and `hₑ = 1/2` radially, roots `(4, 4, 44)`,
# 1.9·10⁷ nodes; and the same with the inner shells' radial elements four
# times as wide, `(4, 1, 44)`. Then the flat box of about the same size on
# the same node, for the ratio: `bin/benchmark.jl`'s 4096 blocks of `16³`,
# 16.8M nodes ("Threads on Symmetry" in `CODE.md`).
name = "ball_benchmark"
description = "TreeWaveOLDG's benchmark ball: a thread scan, and the flat box beside it"
pin = true

[site.symmetry]
time = "1:00:00"

[after]
cmd = 'for d in $SIMLAUNCH_JOBDIRS; do echo "== $d"; cat "$d/output.log"; done'

[[run]]
label = "threads"
cmd = "bin/ball_benchmark.jl --E=4 --Lc=4 --Rm=12 --R1=100 --scan=4:4:44,4:1:44 --reps=5"
threads = [1, 8, 16, 32, 64]

[[run]]
label = "flat"
cmd = "bin/benchmark.jl --D=3 --P=3 --scan=4:16 --reps=5"
threads = 64
