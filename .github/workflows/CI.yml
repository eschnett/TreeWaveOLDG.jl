name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.13 is the floor and the only version tested, as for the
        # other Tree* packages.
        version: ["1.13"]
        os: [ubuntu-latest, macOS-latest]
        include:
          - version: "1.13"
            os: ubuntu-latest
            threads: 4
    env:
      # Precompiled code is built for one fixed CPU per OS, not the
      # runner's own; see the viewer job below. `apple-m1` is the oldest
      # Apple Silicon: GitHub documents every arm64 macOS label as an M1,
      # but has also run TreeWave's macOS cell on an M2 Pro, and a cache
      # built for an M1 loads on any later Apple CPU.
      # The names are per architecture: `x86-64-v3` is an error on arm64.
      JULIA_CPU_TARGET: ${{ matrix.os == 'ubuntu-latest' && 'x86-64-v3' || 'apple-m1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # Which CPU this runner has, so that a cache that was restored and
      # then rebuilt anyway can be matched against the runner that saved it.
      - name: Show the runner's CPU
        run: |
          if command -v lscpu >/dev/null; then
            lscpu | grep -E '^(Model name|Flags)' | cut -c1-200
          else
            sysctl -n machdep.cpu.brand_string
          fi
      # The CPU target is part of the key. Julia does not refuse a cached
      # file built for a different target, as long as this runner's CPU
      # can run it, so without this the caches saved before the target
      # was set (built for `native`) would carry on being restored, and
      # refused only when they landed on a different CPU model.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=${{ env.JULIA_CPU_TARGET }}
      - uses: julia-actions/julia-buildpkg@v1
      # `check_bounds: yes` is the action's default, but it is stated here
      # because the package relies on it: the kernels' reads are
      # `@inbounds` (see "The right-hand side" in CODE.md), and
      # `--check-bounds=yes` overrides `@inbounds` package-wide, so this
      # is where a stencil window that walks out of its block is caught.
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          # Coverage on the single-threaded cells only: the threaded cell
          # runs the same lines.
          coverage: ${{ (matrix.threads || 1) == 1 }}
        env:
          # The answer must not depend on the thread count ("Threads and
          # devices" in CODE.md); one threaded cell runs the suite there.
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ (matrix.threads || 1) == 1 }}
      - uses: codecov/codecov-action@v7
        if: ${{ (matrix.threads || 1) == 1 }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # The viewer has its own environment, so the test job above cannot
  # exercise it. This job runs it for real and keeps the figures, so a
  # plot that silently stops making sense is visible rather than merely
  # unbroken. As in TreeWave.
  viewer:
    name: Viewer (bin/)
    runs-on: ubuntu-latest
    # GitHub's `ubuntu-latest` runners have different x86 CPUs (AMD EPYC
    # 7763, 9V74 and 9V45 seen so far), and Julia builds precompiled code
    # for the CPU it is on (`native`) unless told otherwise. The cache key
    # did not include the CPU, so a cache saved on one CPU model and
    # restored on another could be thrown away whole -- in TreeWave, 352
    # of 392 packages rebuilt after a cache hit. `x86-64-v3` (AVX2, FMA;
    # Haswell and later, every runner GitHub has) is one target, so a
    # build costs what it did and the cache is no larger; code for it
    # loads on any of the runners, at the price of not using AVX-512
    # where a runner has it.
    env:
      JULIA_CPU_TARGET: "x86-64-v3"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      # Which CPU this runner has, so that a cache that was restored and
      # then rebuilt anyway can be matched against the runner that saved it.
      - name: Show the runner's CPU
        run: |
          if command -v lscpu >/dev/null; then
            lscpu | grep -E '^(Model name|Flags)' | cut -c1-200
          else
            sysctl -n machdep.cpu.brand_string
          fi
      # The CPU target is part of the key. Julia does not refuse a cached
      # file built for a different target, as long as this runner's CPU
      # can run it, so without this the caches saved before the target
      # was set (built for `native`) would carry on being restored, and
      # refused only when they landed on a different CPU model.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=${{ env.JULIA_CPU_TARGET }}
      - name: Instantiate the viewer environment
        run: julia --project=bin -e 'using Pkg; Pkg.instantiate()'
      - name: Render the 2D blast wave, truncated and plain
        run: |
          julia --project=bin bin/visualize2d.jl --no-display
          julia --project=bin bin/visualize2d.jl --plain --no-display
      - name: Check that every figure was written
        run: |
          test -s bin/output/blast_2d.png
          test -s bin/output/blast_2d_plain.png
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: bin/output/*.png
